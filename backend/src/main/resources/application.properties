# ── Server ──────────────────────────────────────────────
# Port the embedded Tomcat server listens on
server.port=8080


# ── MySQL DataSource ─────────────────────────────────────
# JDBC URL format: jdbc:mysql://<host>:<port>/<database>
#   useSSL=false               → disables SSL (fine for local dev)
#   serverTimezone=UTC         → avoids timezone mismatch errors
#   allowPublicKeyRetrieval=true → required for MySQL 8 caching_sha2_password auth
spring.datasource.url=jdbc:mysql://localhost:3306/finquest_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Your MySQL username (default is 'root' for local installs)
spring.datasource.username=root

# Your MySQL password — change this to match your local MySQL setup
spring.datasource.password=root

# MySQL 8 JDBC driver class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────
# ddl-auto=none → the schema is fully managed by Flyway migrations.
# Hibernate never auto-creates/alters tables, keeping the schema in sync
# with the versioned migration files.
spring.jpa.hibernate.ddl-auto=none

# Logs every SQL statement Hibernate executes — useful for debugging
spring.jpa.show-sql=true

# Format the logged SQL for readability
spring.jpa.properties.hibernate.format_sql=true

# Hibernate dialect — removed explicit setting, Spring Boot auto-detects MySQL dialect

# ── Flyway ───────────────────────────────────────────────
# Tells Flyway where to find the versioned SQL migrations.
spring.flyway.locations=classpath:db/migration
# Start from the first migration.
spring.flyway.baseline-on-migrate=true
# Skip a DB check so Flyway can manage the schema even if tables already exist.
spring.flyway.enabled=true

# ── App Name ─────────────────────────────────────────────
spring.application.name=finquest-backend

# ── AI Engine ─────────────────────────────────────────────
# Base URL of the Python Flask microservice
# Change host/port if running Flask in Docker or on a remote server
ai.engine.url=http://localhost:5000

# ── JWT Configuration ────────────────────────────────────
# Base64-encoded 256-bit (or longer) secret used to sign JWTs.
# Generate with:  openssl rand -base64 48   (or any 32+ byte Base64 string)
app.jwt.secret=Y2hhbmdlLW1lLXRvLWEtbG9uZy1yYW5kb20tc2VjcmV0LWtleS1mb3ItZm9yLWRldgo=
# Access token lifetime (ms) — 15 minutes
app.jwt.expiration-ms=900000
# Refresh token lifetime (ms) — 7 days
app.jwt.refresh-expiration-ms=604800000

# ── Learning Path ────────────────────────────────────────
# Minimum percentage required to PASS a level quiz (backend source of truth).
quiz.passing-percentage=70

# ── Mail / SMTP (dev) ────────────────────────────────────
# In dev, leave username blank → EmailService logs the link instead of sending.
# For a real provider (e.g. Gmail app password), set host/port/username/password.
app.mail.host=smtp.gmail.com
app.mail.port=587
app.mail.username=
app.mail.password=

# ── AI Finance Brain (Phase 5) ───────────────────────────
ai.brain.enabled=false
ai.brain.provider=gemini
ai.brain.gemini.api-key=${GEMINI_API_KEY:}
ai.brain.gemini.model=gemini-1.5-flash
ai.brain.gemini.endpoint=https://generativelanguage.googleapis.com/v1beta/models/
ai.brain.response.max-tokens=512
ai.brain.timeout-ms=8000

