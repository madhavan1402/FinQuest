# ── Server ──────────────────────────────────────────────
# Port the embedded Tomcat server listens on
server.port=8080

# ── MySQL DataSource ─────────────────────────────────────
# JDBC URL format: jdbc:mysql://<host>:<port>/<database>
#   useSSL=false               → disables SSL (fine for local dev)
#   serverTimezone=UTC         → avoids timezone mismatch errors
#   allowPublicKeyRetrieval=true → required for MySQL 8 caching_sha2_password auth
spring.datasource.url=jdbc:mysql://localhost:3306/finquest_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Your MySQL username (default is 'root' for local installs)
spring.datasource.username=root

# Your MySQL password — change this to match your local MySQL setup
spring.datasource.password=root

# MySQL 8 JDBC driver class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────
# ddl-auto=update → Hibernate auto-creates/updates tables to match entities
# Other options: create, create-drop, validate, none
# Use 'validate' or 'none' in production
spring.jpa.hibernate.ddl-auto=update

# Logs every SQL statement Hibernate executes — useful for debugging
spring.jpa.show-sql=true

# Format the logged SQL for readability
spring.jpa.properties.hibernate.format_sql=true

# Hibernate dialect — removed explicit setting, Spring Boot auto-detects MySQL dialect
# (explicit MySQLDialect caused a deprecation warning in Hibernate 6)

# ── App Name ─────────────────────────────────────────────
spring.application.name=finquest-backend

# ── AI Engine ─────────────────────────────────────────────
# Base URL of the Python Flask microservice
# Change host/port if running Flask in Docker or on a remote server
ai.engine.url=http://localhost:5000
